[program:cloudflared]
command=/usr/local/bin/cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate --loglevel info
directory=/home/ubuntu
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu"
autorestart=true
priority=9
startsecs=5
stdout_logfile=/home/ubuntu/logs/cloudflared.log
stderr_logfile=/home/ubuntu/logs/cloudflared.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile_backups=2
