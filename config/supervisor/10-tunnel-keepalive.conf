[program:tunnel-keepalive]
command=/bin/bash -c "while true; do TS=\$(date +%s%N); curl -s -m 8 -o /dev/null -H 'Cache-Control: no-cache, no-store' \"https://fixes-they-voices-chronicle.trycloudflare.com/?ping=\${TS}\" || true; sleep 25; done"
autostart=true
autorestart=true
user=ubuntu
stdout_logfile=/dev/null
stderr_logfile=/dev/null
priority=300
