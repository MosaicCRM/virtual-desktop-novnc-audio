[program:novnc-audio]
command=/usr/local/bin/node dist/main.js --port 6090 --device virtual_speaker --codec pcm --latency 20000 --bitrate 64000
directory=/home/ubuntu/apps/novnc-audio-server
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",PATH="/usr/local/bin:/usr/bin:/bin:/home/ubuntu/.nvm/versions/node/v22.13.0/bin"
autorestart=true
priority=2
startsecs=3
stdout_logfile=/var/log/supervisor/novnc-audio.log
stderr_logfile=/var/log/supervisor/novnc-audio.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
