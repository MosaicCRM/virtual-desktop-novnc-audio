[program:pulseaudio]
command=/usr/bin/pulseaudio --exit-idle-time=-1 --daemonize=no --log-level=notice
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu"
autorestart=true
priority=1
startsecs=2
stdout_logfile=/var/log/supervisor/pulseaudio.log
stderr_logfile=/var/log/supervisor/pulseaudio.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
