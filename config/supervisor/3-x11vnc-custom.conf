[program:x11vnc-virtual]
command=/usr/bin/x11vnc -display :1 -rfbport 5902 -rfbauth /home/ubuntu/.vnc/passwd -forever -shared -noxdamage -nowf -wait 10 -defer 5 -localhost
priority=3
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/x11vnc-custom.log
stderr_logfile=/var/log/supervisor/x11vnc-custom.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
