[program:websockify-vnc]
command=/usr/bin/python3 -m websockify --heartbeat 30 6900 127.0.0.1:5902
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu"
autorestart=true
priority=4
startsecs=3
stdout_logfile=/var/log/supervisor/websockify-vnc.log
stderr_logfile=/var/log/supervisor/websockify-vnc.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile_backups=2
